AWSTemplateFormatVersion: 2010-09-09
Description: SG Apps

Resources:

  InstanceSecurityGroup:
    Type: AWS::EC2::SecurityGroup
    Properties:
      GroupDescription: Allow http to client host
      VpcId: !ImportValue VpcId
      GroupName: lks-SG-Apps
      SecurityGroupIngress:
        - IpProtocol: tcp
          FromPort: 2049
          ToPort: 2049
          CidrIp: 20.2.2.0/24

        - IpProtocol: tcp
          FromPort: 2049
          ToPort: 2049
          CidrIp: 20.2.3.0/24

        - IpProtocol: tcp
          FromPort: 5000
          ToPort: 5000
          CidrIp: 0.0.0.0/0

        - IpProtocol: tcp
          FromPort: 3306
          ToPort: 3306
          CidrIp: 20.2.2.0/24
        
        - IpProtocol: tcp
          FromPort: 3306
          ToPort: 3306
          CidrIp: 20.2.3.0/24

      SecurityGroupEgress:
        - IpProtocol: -1
          CidrIp: 0.0.0.0/0

      Tags:
        - Key: Name
          Value: SG-Apps

Outputs:
  SGAPPID:
    Description: SG-Apps
    Value: !Ref InstanceSecurityGroup
    Export:
      Name: SGAPPID
